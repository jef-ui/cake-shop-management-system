<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Users — My Sweets by Jesha (Prototype)</title>
<link rel="icon" href="images/mysweets.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="proto-banner" id="proto-banner"></div>
<div class="app-shell">
  <div id="sidebar-mount"></div>
  <div class="main-col">
    <div id="topbar-mount"></div>
    <div class="page-content">
      <div class="page-header">
        <div>
          <h2>Users</h2>
          <p class="sub">Staff accounts and their assigned roles.</p>
        </div>
        <button class="btn btn-primary" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg>
          Add User
        </button>
      </div>

      <div class="card">
        <div class="toolbar">
          <input type="search" placeholder="Search by name or email...">
          <select><option>All roles</option><option>Admin</option><option>Manager</option><option>Cashier</option><option>Baker</option></select>
        </div>
        <div class="table-wrap">
          <table class="data">
            <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th></th></tr></thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
        <div class="pagination">
          <span>Showing 4 of 4 users</span>
          <div class="pages"><span class="active">1</span></div>
        </div>
      </div>
    </div>
    <footer class="foot-note">My Sweets by Jesha — Prototype Preview</footer>
  </div>
</div>
<script src="js/app.js"></script>
<script>
PROTO_INIT_SHELL('users.html', 'Users');
var rows = document.getElementById('rows');
PROTO_DATA.users.forEach(function (u) {
  rows.innerHTML += '<tr>' +
    '<td class="cell-strong">' + u.name + '</td>' +
    '<td class="cell-muted">' + u.email + '</td>' +
    '<td><span class="badge badge-brand">' + u.role + '</span></td>' +
    '<td><span class="badge ' + (u.active ? 'badge-green' : 'badge-gray') + '">' + (u.active ? 'Active' : 'Inactive') + '</span></td>' +
    '<td><div class="row-actions"><button class="icon-btn">' + PROTO_ICON('pencil') + '</button><button class="icon-btn">' + PROTO_ICON('trash') + '</button></div></td>' +
    '</tr>';
});
</script>
</body>
</html>
