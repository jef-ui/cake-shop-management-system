<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audit Logs — My Sweets by Jesha (Prototype)</title>
<link rel="icon" href="images/mysweets.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="proto-banner" id="proto-banner"></div>
<div class="app-shell">
  <div id="sidebar-mount"></div>
  <div class="main-col">
    <div id="topbar-mount"></div>
    <div class="page-content">
      <div class="page-header">
        <div>
          <h2>Audit Logs</h2>
          <p class="sub">Who changed what, and when — Admin only.</p>
        </div>
      </div>

      <div class="card">
        <div class="toolbar">
          <select><option>All users</option><option>Jfree</option><option>Marco dela Cruz</option><option>Cashier One</option></select>
          <select><option>All actions</option><option>Created</option><option>Updated</option><option>Deleted</option></select>
          <input type="date">
        </div>
        <div class="table-wrap">
          <table class="data">
            <thead><tr><th>User</th><th>Action</th><th>Target</th><th>Timestamp</th></tr></thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
        <div class="pagination">
          <span>Showing 5 of 5 log entries</span>
          <div class="pages"><span class="active">1</span></div>
        </div>
      </div>
    </div>
    <footer class="foot-note">My Sweets by Jesha — Prototype Preview</footer>
  </div>
</div>
<script src="js/app.js"></script>
<script>
PROTO_INIT_SHELL('audit-logs.html', 'Audit Logs');
var actionBadge = { 'Created': 'badge-green', 'Updated': 'badge-blue', 'Deleted': 'badge-red' };
var rows = document.getElementById('rows');
PROTO_DATA.auditLogs.forEach(function (l) {
  rows.innerHTML += '<tr>' +
    '<td class="cell-strong">' + l.user + '</td>' +
    '<td><span class="badge ' + actionBadge[l.action] + '">' + l.action + '</span></td>' +
    '<td>' + l.target + '</td>' +
    '<td class="cell-muted">' + l.time + '</td>' +
    '</tr>';
});
</script>
</body>
</html>
