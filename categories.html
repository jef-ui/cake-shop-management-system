<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Categories — My Sweets by Jesha (Prototype)</title>
<link rel="icon" href="images/mysweets.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="proto-banner" id="proto-banner"></div>
<div class="app-shell">
  <div id="sidebar-mount"></div>
  <div class="main-col">
    <div id="topbar-mount"></div>
    <div class="page-content">
      <div class="page-header">
        <div>
          <h2>Categories</h2>
          <p class="sub">Organize your product catalog into categories.</p>
        </div>
        <button class="btn btn-primary" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg>
          Add Category
        </button>
      </div>

      <div class="card">
        <div class="toolbar">
          <input type="search" placeholder="Search categories...">
          <select><option>All statuses</option><option>Active</option><option>Inactive</option></select>
        </div>
        <div class="table-wrap">
          <table class="data">
            <thead><tr><th>Name</th><th>Code Prefix</th><th>Products</th><th>Status</th><th></th></tr></thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
        <div class="pagination">
          <span id="countLabel"></span>
          <div class="pages"><span class="active">1</span></div>
        </div>
      </div>
    </div>
    <footer class="foot-note">My Sweets by Jesha — Prototype Preview</footer>
  </div>
</div>
<script src="js/app.js"></script>
<script>
PROTO_INIT_SHELL('categories.html', 'Categories');
var rows = document.getElementById('rows');
document.getElementById('countLabel').textContent = 'Showing ' + PROTO_DATA.categories.length + ' of ' + PROTO_DATA.categories.length + ' categories';
PROTO_DATA.categories.forEach(function (c) {
  rows.innerHTML += '<tr>' +
    '<td class="cell-strong">' + c.name + '</td>' +
    '<td class="cell-muted">' + c.code + '</td>' +
    '<td>' + c.products + '</td>' +
    '<td><span class="badge ' + (c.active ? 'badge-green' : 'badge-gray') + '">' + (c.active ? 'Active' : 'Inactive') + '</span></td>' +
    '<td><div class="row-actions"><button class="icon-btn">' + PROTO_ICON('pencil') + '</button><button class="icon-btn">' + PROTO_ICON('trash') + '</button></div></td>' +
    '</tr>';
});
</script>
</body>
</html>
