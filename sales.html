<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sales History — My Sweets by Jesha (Prototype)</title>
<link rel="icon" href="images/mysweets.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="proto-banner" id="proto-banner"></div>
<div class="app-shell">
  <div id="sidebar-mount"></div>
  <div class="main-col">
    <div id="topbar-mount"></div>
    <div class="page-content">
      <div class="page-header">
        <div>
          <h2>Sales History</h2>
          <p class="sub">All completed POS transactions.</p>
        </div>
      </div>

      <div class="card">
        <div class="toolbar">
          <input type="search" placeholder="Search by sale ID or cashier...">
          <select><option>All cashiers</option><option>Cashier One</option><option>Cashier Two</option></select>
          <input type="date">
        </div>
        <div class="table-wrap">
          <table class="data">
            <thead><tr><th>Sale ID</th><th>Cashier</th><th>Date</th><th>Items</th><th>Method</th><th>Total</th><th></th></tr></thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
        <div class="pagination">
          <span>Showing 5 of 5 sales</span>
          <div class="pages"><span class="active">1</span></div>
        </div>
      </div>
    </div>
    <footer class="foot-note">My Sweets by Jesha — Prototype Preview</footer>
  </div>
</div>
<script src="js/app.js"></script>
<script>
PROTO_INIT_SHELL('sales.html', 'Sales History');
var rows = document.getElementById('rows');
PROTO_DATA.sales.forEach(function (s) {
  rows.innerHTML += '<tr>' +
    '<td class="cell-strong">' + s.id + '</td>' +
    '<td>' + s.cashier + '</td>' +
    '<td class="cell-muted">' + s.date + '</td>' +
    '<td>' + s.items + '</td>' +
    '<td><span class="badge badge-gray">' + s.method + '</span></td>' +
    '<td>₱' + s.total.toLocaleString() + '</td>' +
    '<td><div class="row-actions"><a class="icon-btn" href="receipt.html">' + PROTO_ICON('eye') + '</a></div></td>' +
    '</tr>';
});
</script>
</body>
</html>
