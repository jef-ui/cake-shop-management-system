<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orders — My Sweets by Jesha (Prototype)</title>
<link rel="icon" href="images/mysweets.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="proto-banner" id="proto-banner"></div>
<div class="app-shell">
  <div id="sidebar-mount"></div>
  <div class="main-col">
    <div id="topbar-mount"></div>
    <div class="page-content">
      <div class="page-header">
        <div>
          <h2>Orders</h2>
          <p class="sub">Custom and ready-made orders, with due dates and status tracking.</p>
        </div>
        <div style="display:flex;gap:0.5rem;">
          <button class="btn btn-secondary" type="button">+ Ready-made Order</button>
          <button class="btn btn-primary" type="button">+ Custom Order</button>
        </div>
      </div>

      <div class="tabs">
        <div class="tab active">All Orders</div>
        <div class="tab">Custom</div>
        <div class="tab">Ready-made</div>
      </div>

      <div class="card">
        <div class="toolbar">
          <input type="search" placeholder="Search by order ID or customer...">
          <select><option>All statuses</option><option>Pending</option><option>Confirmed</option><option>In Production</option><option>Ready</option><option>Completed</option><option>Cancelled</option></select>
          <input type="date">
        </div>
        <div class="table-wrap">
          <table class="data">
            <thead><tr><th>Order ID</th><th>Customer</th><th>Type</th><th>Due Date</th><th>Status</th><th>Total</th><th></th></tr></thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
        <div class="pagination">
          <span>Showing 6 of 6 orders</span>
          <div class="pages"><span class="active">1</span></div>
        </div>
      </div>
    </div>
    <footer class="foot-note">My Sweets by Jesha — Prototype Preview</footer>
  </div>
</div>
<script src="js/app.js"></script>
<script>
PROTO_INIT_SHELL('orders.html', 'Orders');
var badgeMap = {
  'Pending': 'badge-gray', 'Confirmed': 'badge-blue', 'In Production': 'badge-yellow',
  'Ready': 'badge-brand', 'Completed': 'badge-green', 'Cancelled': 'badge-red'
};
var rows = document.getElementById('rows');
PROTO_DATA.orders.forEach(function (o) {
  rows.innerHTML += '<tr>' +
    '<td class="cell-strong">' + o.id + '</td>' +
    '<td>' + o.customer + '</td>' +
    '<td><span class="badge badge-gray">' + o.type + '</span></td>' +
    '<td class="cell-muted">' + o.due + '</td>' +
    '<td><span class="badge ' + badgeMap[o.status] + '">' + o.status + '</span></td>' +
    '<td>₱' + o.total.toLocaleString() + '</td>' +
    '<td><div class="row-actions"><button class="icon-btn">' + PROTO_ICON('eye') + '</button></div></td>' +
    '</tr>';
});
</script>
</body>
</html>
