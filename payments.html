<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payments — My Sweets by Jesha (Prototype)</title>
<link rel="icon" href="images/mysweets.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="proto-banner" id="proto-banner"></div>
<div class="app-shell">
  <div id="sidebar-mount"></div>
  <div class="main-col">
    <div id="topbar-mount"></div>
    <div class="page-content">
      <div class="page-header">
        <div>
          <h2>Payments</h2>
          <p class="sub">Every payment recorded against an order or a sale — including partial/downpayments.</p>
        </div>
      </div>

      <div class="card">
        <div class="toolbar">
          <input type="search" placeholder="Search by reference or order/sale ID...">
          <select><option>All types</option><option>Full</option><option>Downpayment</option><option>Balance</option><option>Refund</option></select>
          <select><option>All methods</option><option>Cash</option><option>Card</option><option>GCash</option><option>Bank Transfer</option></select>
        </div>
        <div class="table-wrap">
          <table class="data">
            <thead><tr><th>Reference</th><th>For</th><th>Type</th><th>Method</th><th>Date</th><th>Amount</th></tr></thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
        <div class="pagination">
          <span>Showing 4 of 4 payments</span>
          <div class="pages"><span class="active">1</span></div>
        </div>
      </div>
    </div>
    <footer class="foot-note">My Sweets by Jesha — Prototype Preview</footer>
  </div>
</div>
<script src="js/app.js"></script>
<script>
PROTO_INIT_SHELL('payments.html', 'Payments');
var typeBadge = { 'Full': 'badge-green', 'Downpayment': 'badge-blue', 'Balance': 'badge-yellow', 'Refund': 'badge-red' };
var rows = document.getElementById('rows');
PROTO_DATA.payments.forEach(function (p) {
  rows.innerHTML += '<tr>' +
    '<td class="cell-strong">' + p.ref + '</td>' +
    '<td>' + p.for + '</td>' +
    '<td><span class="badge ' + typeBadge[p.type] + '">' + p.type + '</span></td>' +
    '<td class="cell-muted">' + p.method + '</td>' +
    '<td class="cell-muted">' + p.date + '</td>' +
    '<td>₱' + p.amount.toLocaleString() + '</td>' +
    '</tr>';
});
</script>
</body>
</html>
